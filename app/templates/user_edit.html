{% extends "base.html" %}
{% block content %}
<section class="panel editor-panel">
  <div class="section-title">
    <span class="icon-badge">编</span>
    <div>
      <h1>编辑用户资料</h1>
      <p class="muted">管理员可修改教师和学生资料。密码留空时不会更改原密码。</p>
    </div>
  </div>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <div class="task-info-strip compact">
    <span>登录账号：<strong>{{ target.username }}</strong></span>
    <span>角色：<strong>{{ target.role }}</strong></span>
    <span>创建时间：<strong>{{ target.created_at }}</strong></span>
  </div>
  <form method="post" action="/admin/users/{{ target.id }}/edit" class="form">
    <div class="form-two">
      <label>姓名（必填）<input name="display_name" required value="{{ (values.display_name if values is defined else target.display_name) or '' }}"></label>
      {% if target.role == 'student' %}
      <label>学号（必填）<input name="student_id" required value="{{ (values.student_id if values is defined else target.student_id) or '' }}"></label>
      {% else %}
      <label>学号<input value="不适用" disabled></label>
      {% endif %}
    </div>
    <div class="form-two">
      <label>联系方式（手机）<input name="phone" value="{{ (values.phone if values is defined else target.phone) or '' }}" autocomplete="tel"></label>
      <label>联系方式（邮箱）<input name="email" type="email" value="{{ (values.email if values is defined else target.email) or '' }}" autocomplete="email"></label>
    </div>
    <div class="form-two">
      <label>新密码<input name="password" type="password" autocomplete="new-password"></label>
      <label>再次输入新密码<input name="password_confirm" type="password" autocomplete="new-password"></label>
    </div>
    <div class="actions">
      <button type="submit">保存修改</button>
      <a class="button secondary" href="/admin/users">返回账号管理</a>
    </div>
  </form>
</section>
{% endblock %}
